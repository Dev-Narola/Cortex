# =============================================================================
# Cortex — production PostgreSQL configuration
# =============================================================================
# A small, production-aware override of the pgvector image's
# defaults. Mounted at ``/etc/postgresql/postgresql.conf`` by
# docker-compose.prod.yml. The container's command line pins
# this file as ``config_file`` so the cluster boots with these
# settings rather than the image's stock config.
#
# Values are tuned for a 1GB-capped Postgres container on the
# same EC2 host as the API. For a larger instance, raise
# ``shared_buffers``, ``effective_cache_size``, and
# ``work_mem`` in proportion.
# =============================================================================

# ---- connection settings --------------------------------------------------
listen_addresses = '*'
max_connections  = 200
# ``superuser_reserved_connections`` keeps 3 connections free
# for the postgres user even under load — important for
# ``pg_dump`` during a backup.
superuser_reserved_connections = 3

# ---- memory ----------------------------------------------------------------
# ``shared_buffers`` ~25% of the container's RAM is the standard
# Postgres guidance. For a 1GB container, 256MB is the right
# starting point.
shared_buffers = 256MB
# ``effective_cache_size`` is what the planner assumes is
# available for OS-level disk cache. ~75% of total RAM is the
# standard; the planner will then prefer index scans over
# seq scans on the assumption that the data is cached.
effective_cache_size = 768MB
# ``work_mem`` is per-operation memory. Too high means a single
# query can balloon to gigabytes; too low means sorts spill to
# disk. 16MB is a reasonable production default.
work_mem = 16MB
maintenance_work_mem = 128MB

# ---- WAL -------------------------------------------------------------------
# ``wal_level=replica`` is the minimum for any future
# replication. We are not replicating today, but the cost is
# negligible and removing it later is a breaking change.
wal_level = replica
# ``max_wal_size`` controls how much WAL the server keeps
# around. 1GB is comfortable for a low-traffic deployment and
# caps recovery time after a crash.
max_wal_size = 1GB
min_wal_size = 80MB
# ``synchronous_commit = on`` is the default and the right
# choice for a relational store. ``off`` would only be a
# performance optimization if durability is sacrificed
# knowingly — not a Cortex trade-off.
synchronous_commit = on
checkpoint_completion_target = 0.9

# ---- query planner ---------------------------------------------------------
# Raise the planner's statistics target on a write-heavy
# table. 100 is the default; 200 doubles the cost of
# ``ANALYZE`` and gives noticeably better plans on the
# ``document_chunks`` table once it has more than a few
# thousand rows.
default_statistics_target = 200
# ``random_page_cost`` is 4.0 by default which assumes a
# spinning disk. SSD-backed EC2 storage performs closer to
# 1.1; lower the cost to keep the planner from preferring
# seq scans over index scans unnecessarily.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- logging ---------------------------------------------------------------
# Application-name is set by the api / worker via the
# connection string. ``log_line_prefix`` is a one-line
# machine-parseable prefix that the log shipping pipeline
# (e.g. a CloudWatch agent) can split into fields.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%t [%p]: db=%d,user=%u,app=%a '

# ---- autovacuum ------------------------------------------------------------
# pgvector / embedding tables are write-heavy and benefit
# from more frequent vacuum. The default is ``scale = 0.2``;
# we tighten it to keep the HNSW index healthy.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025

# ---- pgvector extension ----------------------------------------------------
# The pgvector image ships the extension pre-installed. No
# extra config is required here — the extension is enabled
# per-database via ``CREATE EXTENSION IF NOT EXISTS vector``
# in the V0 migration (alembic/versions/add9234e745c_enable_pgvector.py).

# ---- locale / encoding -----------------------------------------------------
# The compose env sets ``POSTGRES_INITDB_ARGS='--encoding=UTF8
# --locale=C'`` so these are documented as the cluster
# defaults; explicit here for grep-ability.
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# ---- timezone --------------------------------------------------------------
# UTC end-to-end. ``timestamptz`` columns store instants; the
# session timezone only affects display. UTC keeps every log
# line and every API response timestamp aligned.
timezone = 'UTC'
