# =============================================================================
# Cortex — Redis production configuration
# =============================================================================
# Used by docker-compose.prod.yml. Replaces the CLI --flag value approach
# which has known parsing issues in Redis 7.4+.

# --- Networking --------------------------------------------------------------
bind 0.0.0.0
# Reachable only on the private compose network (no published port).
# shortcut: no requirepass; add one (and put it in REDIS_URL) before Redis is ever exposed beyond that network.
protected-mode no

# --- Persistence: AOF (primary) + RDB (backup) ------------------------------
appendonly yes
appendfsync everysec

# Save RDB snapshot if at least 100 keys changed in 60 seconds.
save 60 100

# --- Memory ------------------------------------------------------------------
maxmemory 256mb
# Redis is the arq job broker: evicting keys would silently drop queued jobs.
maxmemory-policy noeviction

# --- Logging -----------------------------------------------------------------
loglevel notice
