# Shared proxy rules, included by both site templates (HTTP and TLS).
# X-Forwarded-Proto is $scheme here: nginx terminates TLS itself.

# healthcheck and the ALB target group can probe without
# hitting the api. The same JSON shape as the api's
# ``/health`` is returned.
location = /health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok"}';
}

# Allow document uploads up to 20 MB. The api enforces its own
# limit (MAX_DOCUMENT_SIZE_BYTES); nginx must be at least as
# generous or the browser sees a cryptic 413 instead of the
# api's 400 with a proper error body.
client_max_body_size 20m;

# Metrics endpoint is reachable only from the docker
# network (no public port mapping). When the ALB probes
# the api, the api's own /metrics route is the one to
# expose to Prometheus — not this proxy.
# /system/status (versions, uptime, dependency state) is internal too.
location ~ ^/(metrics|system/status)$ {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://cortex_api;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- WebSocket: streaming chat ----------------------------------
# The conversation WebSocket uses long-lived connections;
# the standard ``proxy_read_timeout 60s`` would kill them
# after a minute of silence. ``3600s`` is the per-nginx
# upstream idle timeout; matching the ALB's idle timeout
# (default 60s — bump it on the target group) keeps the
# connection alive for the full chat session.
location /ws/ {
    proxy_pass http://cortex_api;

    proxy_http_version 1.1;
    proxy_set_header   Upgrade          $http_upgrade;
    proxy_set_header   Connection       "upgrade";
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Long-lived connection: 1 hour, then the ALB's
    # per-request keep-alive takes over.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    # WebSocket frames are small; buffering buys us
    # nothing and adds latency.
    proxy_buffering     off;
}

# ---- Static assets (placeholder for a future frontend) ----------
# The next.js / static SPA, if it ever lands, would be
# served from here. For V5 the directory is empty and
# the location returns 404, which is the right behaviour.
location /static/ {
    alias /var/www/html/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ---- API and GraphQL --------------------------------------------
location / {
    proxy_pass http://cortex_api;

    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-ID      $request_id;

    # Reuse the upstream connection for the next request
    # from the same client. ``proxy_set_header Connection
    # ""`` (above) is the matching client side of the
    # ``keepalive 32`` directive in nginx.conf.
    proxy_redirect off;
}
