[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .
version_path_separator = :

# The string output with "alembic current" is supposed to indicate
# the current rev
# version_path_separator = :

# The output encoding used when revision files are written from
# script.py.mako
# output_encoding = utf-8

# V4 dev-experience fix — host port 5432 is taken
# by a Windows Postgres service on this machine;
# the docker compose maps 5433 on the host to 5432
# inside the container. The .env file (or the
# ``$DATABASE_URL`` env var) overrides this default.
# The fallback URL is only used when neither is set.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5433/app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(threadName)s %(message)s
