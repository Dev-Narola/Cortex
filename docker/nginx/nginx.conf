# =============================================================================
# Cortex — main nginx configuration
# =============================================================================
# One process per CPU. ``worker_connections`` is the per-worker
# cap; the effective ceiling is ``worker_processes *
# worker_connections``. 1024 is conservative for a backend
# that only ever talks to one upstream; raise it if you front
# many slow clients.
#
# ``user`` is set to the nginx image's built-in ``nginx`` user
# (UID 101). The image's Dockerfile already chowns the right
# directories to that user, so we let the master run as root
# (so it can bind to 80/443) and let the workers drop.
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

# --- error / pid / daemon ---------------------------------------------------
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# --- events ----------------------------------------------------------------
events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

# --- http ------------------------------------------------------------------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- logging format ------------------------------------------------
    # The default ``combined`` log format includes the
    # ``X-Forwarded-For`` client IP only as the first item in a
    # comma-separated list, which is awkward to parse. The
    # ``cortex`` format below surfaces the real client IP
    # (after the load balancer) in its own field.
    log_format  cortex  '$remote_addr - $request_id [$time_iso8601] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'urt="$upstream_response_time" '
                        'uaddr="$upstream_addr"';

    access_log  /var/log/nginx/access.log  cortex;

    # ---- performance ----------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    # Larger buffer for proxying responses; the default 4k
    # buffer causes unnecessary disk I/O for any non-trivial
    # JSON payload the API returns.
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;
    proxy_busy_buffers_size 32k;

    # ---- gzip -----------------------------------------------------------
    # Compresses JSON responses (which are the bulk of the API
    # surface). The ``text/plain`` type is included for
    # documentation-style endpoints. The level of 5 is a
    # compromise between CPU and ratio — level 6 buys us
    # ~5% more compression at ~30% more CPU.
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---- request size / timeouts ---------------------------------------
    # ``client_max_body_size`` is mirrored to
    # ``settings.NGINX_MAX_BODY_SIZE`` so the proxy and the
    # app agree. The default of 12m matches the api's
    # MAX_DOCUMENT_SIZE_BYTES (10m) plus JSON / multipart
    # overhead.
    client_max_body_size      12m;
    client_body_buffer_size   128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ---- timeouts -------------------------------------------------------
    # ``connect`` covers the TCP handshake to the upstream.
    # ``send`` / ``read`` cover the actual data exchange.
    # Streaming endpoints (WebSocket chat) override these
    # at the location level.
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # ---- upstream -------------------------------------------------------
    # The api upstream resolves via Docker's internal DNS to
    # the api service's IP. ``keepalive`` reuses TCP
    # connections to the upstream, which materially reduces
    # request latency for high-frequency callers.
    upstream cortex_api {
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
