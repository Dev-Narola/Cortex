# =============================================================================
# Cortex — site (default server) configuration
# =============================================================================
# Two server blocks:
#
#   :80   — terminates HTTP. By default it issues a 301 redirect
#           to HTTPS. In a TLS-disabled dev / preview environment
#           it serves the site directly so the proxy can be tested
#           without a certificate. Toggle via the ``$enable_https``
#           variable; ``scripts/deploy.sh`` sets it to ``true``
#           when a certificate is rendered.
#
#   :443  — terminates HTTPS (when configured) and proxies to the
#           api. The TLS server block is fully commented out and
#           ready to be enabled by uncommenting the ``listen 443
#           ssl http2;`` line and the ``ssl_certificate`` /
#           ``ssl_key`` paths.
#
# Both server blocks honour ``X-Forwarded-Proto`` /
# ``X-Forwarded-For`` so the api, which is configured to trust
# the proxy, sees the real client scheme and IP for redirects and
# audit logging.
# =============================================================================

# Map a single "is HTTPS enabled?" switch. The deploy script
# sets this to ``true`` once a certificate has been rendered;
# until then every request goes to the :80 server.
map $http_x_forwarded_proto $cortex_https {
    default $scheme;
    https   https;
}

# -----------------------------------------------------------------------------
# :80 — HTTP entry point
# -----------------------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # When TLS is enabled, the :80 server is a pure redirect
    # target. ``$cortex_https`` preserves the original scheme
    # so requests that already arrived over HTTPS (e.g. ALB
    # -> nginx on :80 inside the same VPC) do not get
    # redirected in a loop.
    if ($cortex_https = "https") {
        return 301 https://$host$request_uri;
    }

    # Without TLS, the :80 server proxies normally so the
    # platform is testable end-to-end without a certificate.
    # The same location / header logic as the :443 block
    # applies.

    # Match ``server.cortex.io`` style names in production.
    # Replace with the real public hostname.
    # server_name  api.cortex.example.com;

    # Health endpoint is served directly so the Docker
    # healthcheck and the ALB target group can probe without
    # hitting the api. The same JSON shape as the api's
    # ``/health`` is returned.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Metrics endpoint is reachable only from the docker
    # network (no public port mapping). When the ALB probes
    # the api, the api's own /metrics route is the one to
    # expose to Prometheus — not this proxy.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://cortex_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket: streaming chat ----------------------------------
    # The conversation WebSocket uses long-lived connections;
    # the standard ``proxy_read_timeout 60s`` would kill them
    # after a minute of silence. ``3600s`` is the per-nginx
    # upstream idle timeout; matching the ALB's idle timeout
    # (default 60s — bump it on the target group) keeps the
    # connection alive for the full chat session.
    location /ws/ {
        proxy_pass http://cortex_api;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long-lived connection: 1 hour, then the ALB's
        # per-request keep-alive takes over.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # WebSocket frames are small; buffering buys us
        # nothing and adds latency.
        proxy_buffering     off;
    }

    # ---- Static assets (placeholder for a future frontend) ----------
    # The next.js / static SPA, if it ever lands, would be
    # served from here. For V5 the directory is empty and
    # the location returns 404, which is the right behaviour.
    location /static/ {
        alias /var/www/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- API and GraphQL --------------------------------------------
    location / {
        proxy_pass http://cortex_api;

        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;

        # Reuse the upstream connection for the next request
        # from the same client. ``proxy_set_header Connection
        # ""`` (above) is the matching client side of the
        # ``keepalive 32`` directive in nginx.conf.
        proxy_redirect off;
    }
}

# -----------------------------------------------------------------------------
# :443 — HTTPS entry point (uncomment to enable)
# -----------------------------------------------------------------------------
# server {
#     listen      443 ssl http2 default_server;
#     listen      [::]:443 ssl http2 default_server;
#     server_name api.cortex.example.com;
#
#     # Rendered by scripts/deploy.sh from AWS ACM / Let's Encrypt.
#     # When using ACM, the certificate and key live at
#     # /etc/cortex/tls/fullchain.pem and /etc/cortex/tls/privkey.pem.
#     ssl_certificate     /etc/nginx/tls/fullchain.pem;
#     ssl_certificate_key /etc/nginx/tls/privkey.pem;
#
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#     ssl_session_tickets off;
#
#     # HSTS: 2 years, include subdomains, preload-ready.
#     # Be careful enabling preload — once you're on the
#     # preload list, removal takes months.
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#     add_header X-Content-Type-Options    "nosniff" always;
#     add_header X-Frame-Options           "DENY" always;
#     add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
#
#     # ... location blocks identical to the :80 server above.
#     # See the HTTP server block for the full set.
# }
