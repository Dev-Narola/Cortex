[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.1.0"
description = "Multi-tenant AI Knowledge and Agent Platform"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "psycopg[binary]>=3.2.0",
    "redis",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    # boto3 is the official AWS SDK for Python and the de-facto
    # standard for talking to S3 (and S3-compatible stores like
    # MinIO). The S3Storage adapter in src/ingestion/infrastructure/
    # s3_storage.py is the only file that imports it; the abstract
    # ObjectStorage interface and the LocalStorage in-memory
    # implementation in storage.py are deliberately boto3-free so
    # the rest of the codebase stays testable without it.
    "boto3>=1.34.0",
    # Required by FastAPI for multipart/form-data file upload support.
    "python-multipart>=0.0.9",
    # Parsers
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "tiktoken>=0.8.0",
    "arq>=0.25.0",
    "pgvector>=0.2.5",
    "openai>=1.0.0",
    # tiktoken powers the ContextWindowManager's per-token budget math.
    # Optional at runtime — the manager falls back to a 4-chars-per-token
    # heuristic if tiktoken is missing — but the real encoder is what we
    # want in production.
    "tiktoken>=0.8.0",
    # --- V4: OpenTelemetry observability stack ---
    # Each package below is justified in ``Docs/adr/0022-otel-dependency-set.md``.
    # The split (api / sdk / exporter) keeps the API surface available at
    # runtime so call sites can ``tracer.start_as_current_span(...)``
    # without the SDK being configured — important for unit tests and
    # for libraries that may be imported before the application boots.
    "opentelemetry-api>=1.27.0",       # application-facing API
    "opentelemetry-sdk>=1.27.0",        # TracerProvider / MeterProvider
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",  # OTLP/HTTP exporter
    "opentelemetry-instrumentation-fastapi>=0.48b0",   # HTTP server spans
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",# DB spans
    "opentelemetry-instrumentation-redis>=0.48b0",      # Redis spans
    "opentelemetry-instrumentation-httpx>=0.48b0",      # outbound HTTP
    "opentelemetry-instrumentation-arq>=0.48b0",        # background jobs
    "opentelemetry-semantic-conventions>=0.48b0",       # gen_ai.* attributes
    "prometheus-client>=0.20.0",        # /metrics exposition
    "structlog>=24.4.0",                # structured JSON logs
]
[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
    "black>=25.1.0",
    "mypy>=1.8.0",
    "pre-commit>=4.2.0"
]
[tool.setuptools]
packages = []
[tool.black]
line-length = 88
target-version = ["py312"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]
ignore = ["B008"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# The default ``pytest`` invocation runs the unit,
# eval, and the *V4* integration suite. The
# V3-era integration tests under
# ``tests/integration/retrieval/`` and
# ``tests/integration/test_redis_client_integration.py``
# require a live Postgres-with-pgvector / Redis
# service. They are marked ``live_infra`` and only
# run with ``pytest -m live_infra``.
markers = [
    "integration: tests that can use local service dependencies",
    "live_infra: tests that need a real Postgres / Redis",
]
# Skip the live-infra tests by default. The
# coverage options are listed first; the ``-m
# not live_infra`` is appended last so pytest sees
# a single coherent ``addopts`` block.
addopts = [
    "--cov=src",
    "--cov-config=pyproject.toml",
    "--cov-report=term",
    "--cov-report=xml:coverage.xml",
    "--cov-report=html:htmlcov",
    "-m",
    "not live_infra",
]

# ---------------------------------------------------------------------------
# Coverage configuration (V4 Phase 20)
# ---------------------------------------------------------------------------
#
# The current ``fail_under`` is set to the *measured* V4
# baseline (67 % on the unit-test suite). This guarantees
# that future changes cannot silently *decrease* coverage
# — the bar is the bar. The V5 roadmap is to lift the bar
# to 80 % by adding:
#
#   * integration tests that exercise the live Postgres
#     path (currently the unit suite mocks the engine);
#   * tests for the V4 observability infrastructure
#     (``otel.py``, ``genai_spans.py``, ``redaction.py``)
#     which are 0 % today because the OTel SDK is lazy-
#     loaded and the redaction layer is hard to exercise
#     without a live stack;
#   * tests for the new billing / audit services.
#
# The ``include`` filter tracks per-layer coverage; the
# ``exclude_also`` lines are the right place to add
# generated / boilerplate / ``__init__.py`` noise so the
# report focuses on actual logic.

[tool.coverage.run]
# Branch coverage doubles the executable-line count
# (every ``if`` and ``and`` counts as a branch). The V4
# baseline (67 %) was measured with line coverage only;
# flipping ``branch = true`` to "true" would force a
# step-change in the bar without giving us a meaningful
# signal (most of the V4 code paths are small and
# exhaustive). The V5 follow-up will re-measure with
# branch coverage and bump the bar accordingly.
branch = false
source = ["src"]
omit = [
    "*/__pycache__/*",
    "*/__init__.py",
    "*/tests/*",
]

[tool.coverage.report]
# The V4-baseline bar. Lifted in V5 once the integration
# tests land.
fail_under = 67
# Surface the per-layer breakdown so a future "did
# coverage regress in billing?" question is one grep
# away. ``show_missing = true`` lists uncovered line
# numbers — invaluable for the "why is this file 60 %?"
# drilldown.
skip_empty = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
    "pass",
]
# Per-package precision. ``/domain`` and ``/application``
# are the security-critical surfaces; we set a
# per-package precision (the row "fail_under" line
# only checks the *total*). A future change to
# fail_under_per_package is documented in ADR-0025.
precision = 1
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
exclude = [
    "^\\.venv/",
    "^\\.pytest_cache/",
    "^\\.ruff_cache/",
]
