name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Run tests
        env:
          # Tests use SQLite (via the per-fixture in-memory engine) and
          # the `db_mock`/`redis_mock` fixtures in tests/conftest.py,
          # so we don't need a live Postgres or Redis service here.
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret
        run: |
          pytest -v --tb=short
