name: CI

on:
  pull_request:
  push:
    branches: [main]

# Stop a previous run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Backend — the Cortex Python service.
  # ----------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cortex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Architecture validation
        run: python scripts/architecture_check.py
      - name: Lint
        run: |
          ruff check src tests
      - name: Type check
        run: |
          mypy src
      - name: Tests
        run: |
          pytest tests/unit tests/chaos tests/contracts tests/architecture tests/performance --no-cov
      - name: Security scan
        run: |
          bandit -r src -q || true

  # ----------------------------------------------------------------
  # Frontend — the Next.js monorepo.
  # ----------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Build
        run: pnpm --filter @cortex/web build
      - name: E2E
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
