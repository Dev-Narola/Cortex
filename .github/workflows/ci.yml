name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Run tests
        env:
          # Tests use SQLite (via the per-fixture in-memory engine) and
          # the `db_mock`/`redis_mock` fixtures in tests/conftest.py,
          # so we don't need a live Postgres or Redis service here.
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret
        run: |
          # V4 Phase 20 — coverage is enforced by the
          # ``fail_under`` rule in pyproject.toml. The CI
          # build fails when line coverage drops below
          # the V4-baseline bar (67 % on 2026-07-26).
          # The ``addopts`` block in [tool.pytest.ini_options]
          # already passes the right ``--cov`` flags, so
          # this command is just the test invocation.
          pytest -v --tb=short

      - name: Coverage summary
        # A short tail-of-coverage block, so the
        # PR-review screen shows the per-package
        # numbers without making the reviewer open
        # the HTML report. ``cat`` + ``tail`` so we
        # show the *total* and the worst-covered
        # packages, not the full table.
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            echo "Coverage gate: see pytest output above."
            echo "Detailed report: htmlcov/index.html"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov
          retention-days: 14
