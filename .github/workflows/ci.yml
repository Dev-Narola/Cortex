name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e .[dev]
      - name: Formatting check
        run: |
          ruff check src tests
      - name: Type check
        run: |
          mypy src
      - name: Unit + integration tests
        run: |
          pytest tests/unit tests/integration --cov=src --cov-fail-under=65
      - name: Contract tests
        run: |
          pytest tests/contracts
      - name: Architecture validation
        run: |
          python scripts/architecture_check.py
          pytest tests/architecture
      - name: Chaos tests
        run: |
          pytest tests/chaos
      - name: Performance smoke tests
        run: |
          pytest tests/performance -k "registered or within_threshold" --maxfail=1
        continue-on-error: true
      - name: Security scan
        run: |
          bandit -r src -q || true
