name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  v0-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      APP_NAME: Cortex
      APP_VERSION: 0.1.0
      APP_DESCRIPTION: Multi-tenant AI Knowledge and Agent Platform
      DEBUG: "true"
      ENVIRONMENT: testing
      HOST: 0.0.0.0
      PORT: "8000"
      WORKERS: "1"
      API_V1_PREFIX: /api/v1
      SECRET_KEY: test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Alembic environment
        run: alembic current

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest
