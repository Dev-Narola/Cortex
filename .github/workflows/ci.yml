name: CI

on:
  pull_request:
  # Every branch push runs the gate; only main's success triggers Deploy.
  push:
  workflow_dispatch:

# Stop a previous run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # Backend — the release gate. Unit/integration suite on SQLite with
  # the enforced coverage bar, then migrations + live tests against a
  # real Postgres/pgvector and Redis.
  # ----------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cortex
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://cortex:cortex@localhost:5432/cortex_ci
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: ci
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Cortex/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (syntax errors, undefined names)
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Architecture (no new violations beyond the recorded baseline)
        run: python scripts/architecture_check.py --baseline ../Docs/governance/architecture-baseline.txt
      - name: Type-check ratchet (116 known errors; must not grow)
        run: |
          set +e
          out=$(mypy src 2>&1); echo "$out" | tail -1
          n=$(echo "$out" | sed -n 's/^Found \([0-9]*\) errors.*/\1/p'); n=${n:-0}
          test "$n" -le 116 || { echo "mypy errors grew to $n (baseline 116)"; exit 1; }
      - name: Tests + coverage gate
        run: pytest -q
      - name: Migrations upgrade / downgrade / upgrade
        run: |
          alembic upgrade head
          alembic downgrade -4
          alembic upgrade head
      - name: Live Postgres + pgvector tests
        run: pytest -q -m live_infra tests/live --no-cov
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: Cortex/coverage.xml
          if-no-files-found: ignore
