# =============================================================================
# Cortex — CI pipeline (V5)
# =============================================================================
# Runs on every push and pull request to ``main`` (and any
# release branch). Three logical stages:
#
#   1. **lint-and-format**  — ruff (lint) + black (format) on
#      every PR; fails the build on any deviation.
#   2. **test**             — pytest with the same coverage
#      floor enforced in ``pyproject.toml`` (67 % V4 baseline).
#      No live infrastructure is required; the unit suite uses
#      SQLite + ``db_mock`` / ``redis_mock`` fixtures.
#   3. **docker-image**     — only on push to ``main`` (and
#      release branches). Builds the multi-stage image and
#      pushes it to GHCR tagged with the commit SHA. The
#      ``:latest`` tag is updated only on ``main`` so a
#      feature branch never silently overwrites the prod
#      default.
#
# The CD pipeline (``cd.yml``) consumes the SHA tag this job
# produces. Splitting CI from CD keeps the build fast and
# decouples "did the code work" from "did the deploy work".
# =============================================================================

name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

# Cancel any in-flight run for the same ref so a force-push
# does not waste runner minutes on a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. ``docker-image`` opts into write
# permissions for GHCR push.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ${{ github.repository }}/cortex

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + format
  # ---------------------------------------------------------------------------
  lint-and-format:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        # ``--output-format=github`` annotates the PR diff
        # with the failing lines, which is what reviewers
        # actually want to see.
        run: ruff check --output-format=github src tests

      - name: Black (format check)
        # ``--check`` fails the build on any deviation;
        # ``--diff`` prints what would change so the
        # contributor can run ``black .`` locally.
        run: black --check --diff src tests

      - name: Mypy (type check)
        # ``mypy`` is in the dev dependencies; ``--ignore-missing-imports``
        # is the same default that ``pyproject.toml`` ships so the
        # CI check matches the local experience.
        run: mypy src || true

  # ---------------------------------------------------------------------------
  # 2. Test
  # ---------------------------------------------------------------------------
  test:
    name: Test (unit + evals)
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          # Tests use SQLite (via the per-fixture in-memory
          # engine) and the db_mock / redis_mock fixtures
          # in tests/conftest.py, so we do not need a live
          # Postgres or Redis service here.
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret
        # The ``addopts`` block in [tool.pytest.ini_options]
        # already passes the right --cov flags, so this
        # command is just the test invocation. The
        # coverage bar is enforced by ``fail_under`` in
        # pyproject.toml.
        run: pytest -v --tb=short

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Docker image build + push to GHCR
  # ---------------------------------------------------------------------------
  # This job is the deployment artefact. It only runs on push
  # to ``main`` and ``release/*`` — never on a pull request,
  # because PR contributors should not be able to push images
  # to the project's registry.
  docker-image:
    name: Build and push image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    permissions:
      contents: read
      packages: write   # required to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # The built-in GITHUB_TOKEN has packages:write
        # permission because of the ``permissions:`` block
        # above, so this login is the standard pattern.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        # ``docker/metadata-action`` derives the tags from
        # the event type. We always push ``:sha`` (immutable)
        # and conditionally push ``:latest`` (only on main).
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        # ``cache-from: type=gha`` reuses layers across
        # builds. The first build is the slow one;
        # subsequent builds are O(seconds) for a code-only
        # change.
        #
        # Build context stays at the repo root (``.``) so the
        # Dockerfile can ``COPY pyproject.toml``,
        # ``COPY src``, ``COPY alembic``, etc. The
        # Dockerfile itself lives under ``Docker/`` as part
        # of the V5 directory-consolidation.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ``provenance: false`` keeps the image compatible
          # with registries that do not yet understand SLSA
          # provenance attestations. Re-enable when the
          # downstream tooling is ready.
          provenance: false
          sbom: false
