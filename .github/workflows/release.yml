name: Release

# Tag v* -> build the production image and publish it to GHCR as
# ghcr.io/<owner>/cortex:<tag>. (The host still builds from git; the
# published image is the reproducible artifact for the release.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cortex" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Cortex
          file: Cortex/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
