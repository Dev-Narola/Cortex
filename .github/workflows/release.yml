name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install backend
        run: |
          cd Cortex
          pip install -e ".[dev]"
      - name: Install frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
      - name: Backend tests
        run: |
          cd Cortex
          pytest tests/unit tests/chaos tests/contracts tests/architecture tests/performance --no-cov
      - name: Frontend build
        run: |
          cd frontend
          pnpm --filter @cortex/web build
      - name: Build container
        run: |
          docker build -t cortex:${{ github.ref_name }} .
      - name: Publish
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          docker push cortex:${{ github.ref_name }}
      - name: Post-deploy validation
        run: |
          echo "Smoke checks run against staging after this step."
